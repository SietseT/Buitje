services:
  buitje:
    image: ghcr.io/sietset/buitje:latest
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - buitje-frames:/app/apps/backend/.data
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/backend/.tmp

volumes:
  buitje-frames:
